<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Attestatsiya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1226; --bg2:#171B36; --card:#1B2042; --card2:#222850; --line:#2C3363;
  --green:#22F573; --green-d:#12C95A; --pink:#F70077; --orange:#FF8C4C; --blue:#5498FF;
  --white:#F7F8F9; --muted:#9AA1C9; --dim:#6B729E;
  --r:18px; --r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Manrope,system-ui,sans-serif;color:var(--white);background:var(--bg);
  min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.45;
}
body::before{ /* fon nurlari */
  content:"";position:fixed;inset:-20% -30% auto -30%;height:120%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 30% at 15% 10%, rgba(120,60,220,.35), transparent 70%),
    radial-gradient(35% 25% at 90% 35%, rgba(34,245,115,.12), transparent 70%),
    radial-gradient(45% 30% at 30% 80%, rgba(84,152,255,.18), transparent 70%),
    linear-gradient(180deg,#141832 0%, #0F1226 60%);
}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:520px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-b))}
.hidden{display:none!important}

/* yuqori panel */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--blue),#8a5cff);overflow:hidden;font-size:15px}
.ava img{width:100%;height:100%;object-fit:cover}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.pill svg{width:16px;height:16px}

/* sarlavha */
.hero{margin:6px 0 18px;position:relative}
.hero h1{font-size:34px;line-height:1.05}
.hero h1 .g{color:var(--green);display:block}
.hero p{color:var(--muted);margin:10px 0 0;font-size:14px;max-width:34ch}
.spark{position:absolute;right:8px;top:30px;width:34px;height:34px;color:var(--green)}

/* kartochka */
.card{background:linear-gradient(180deg,rgba(34,40,80,.92),rgba(27,32,66,.92));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* daraja */
.lvl{display:flex;gap:14px;align-items:center}
.lvl .gem{width:64px;height:64px;flex:none;filter:drop-shadow(0 6px 18px rgba(34,245,115,.45))}
.lvl .info{flex:1;min-width:0}
.lvl .name{font-family:Fraunces,serif;font-weight:800;font-size:20px}
.lvl .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.bar{height:9px;border-radius:9px;background:#0E1230;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--green-d),var(--green));
  box-shadow:0 0 12px rgba(34,245,115,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.levels{display:flex;align-items:flex-start;justify-content:space-between;margin-top:16px;gap:2px}
.levels .l{flex:1;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.25}
.levels .l svg{width:34px;height:34px;display:block;margin:0 auto 4px}
.levels .l.off svg{filter:grayscale(1) brightness(.55);opacity:.7}
.levels .l b{display:block;color:var(--white);font-size:11px}
.levels .arrow{color:var(--dim);font-size:10px;padding-top:12px}

/* check-in */
.days{display:flex;gap:6px;justify-content:space-between;margin-bottom:12px}
.day{flex:1;text-align:center;font-size:10px;color:var(--dim)}
.day .c{width:100%;aspect-ratio:1;max-width:40px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:11.5px;background:var(--white);color:#141832}
.day.done .c{background:var(--green);color:#06210F;box-shadow:0 0 12px rgba(34,245,115,.55)}
.day.next .c{outline:2px dashed var(--green);outline-offset:2px}

/* tugmalar */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;
  font-weight:800;font-size:15px;background:var(--green);color:#06210F;box-shadow:0 8px 24px rgba(34,245,115,.25);
  transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--white);box-shadow:none;border:1px solid var(--line)}
.btn.white{background:var(--white);color:#141832;box-shadow:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* statistika */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.stat b{display:block;font-family:Fraunces,serif;font-size:22px}
.stat span{font-size:11.5px;color:var(--muted)}

/* ro'yxat */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;text-align:left;width:100%;transition:border-color .15s, background .15s}
.item:active{background:var(--card2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;font-size:14px}
.item .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.item .n{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.item .chev{color:var(--dim)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.g{background:rgba(34,245,115,.14);color:var(--green)}
.tag.b{background:rgba(84,152,255,.15);color:var(--blue)}
.grp{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 6px}

.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.crumbs .ct{min-width:0}
.crumbs .ct small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .ct b{font-family:Fraunces,serif;font-size:20px;display:block;line-height:1.15}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#12163A;color:var(--white);
  margin-bottom:10px;outline:none}
.search:focus{border-color:var(--green)}
.seg{display:flex;background:#12163A;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--green);color:#06210F}

/* test */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qhead b{color:var(--white)}
.qtext{font-size:17px;font-weight:700;line-height:1.4;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:14.5px;transition:all .18s}
.opt .L{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;background:#12163A;color:var(--muted)}
.opt.sel{border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:rgba(34,245,115,.1)}
.opt.ok .L{background:var(--green);color:#06210F}
.opt.bad{border-color:var(--pink);background:rgba(247,0,119,.1)}
.opt.bad .L{background:var(--pink);color:#fff}
.opt[disabled]{cursor:default}
.explain{border-left:3px solid var(--green);background:rgba(34,245,115,.06);padding:10px 12px;border-radius:0 12px 12px 0;
  color:#CFE9DA;font-size:13.5px;margin:6px 0 14px}
.explain.bad{border-color:var(--pink);background:rgba(247,0,119,.07);color:#F2C9DC}

/* yuklanish */
.loader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 12px}
.ring{width:56px;height:56px;border-radius:50%;border:4px solid rgba(34,245,115,.15);border-top-color:var(--green);animation:spin 1s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader b{font-family:Fraunces,serif;font-size:20px}
.loader p{color:var(--muted);margin:8px 0 0;font-size:13.5px;min-height:40px}

/* natija */
.score{display:grid;place-items:center;margin:8px 0 16px}
.score svg{width:170px;height:170px}
.score .pc{font-family:Fraunces,serif;font-size:40px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px}
.badge.g{background:rgba(34,245,115,.15);color:var(--green)}
.badge.p{background:rgba(247,0,119,.15);color:#ff5aa8}
.xpgain{font-family:Fraunces,serif;font-size:26px;color:var(--green)}

/* reyting */
.lb .item{padding:10px 12px}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.rank.r1{background:#FFC83D;color:#3a2600}.rank.r2{background:#C9D3F2;color:#1d2340}.rank.r3{background:var(--orange);color:#3a1600}
.lb .ava{width:32px;height:32px;font-size:12px}
.lb .xp{font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px}
.lb .xp svg{width:14px;height:14px}
.me-row{position:sticky;bottom:calc(84px + var(--safe-b));margin-top:10px;border-color:var(--green)!important;background:#1A2A3A!important}

/* pastki menyu */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 16px calc(10px + var(--safe-b));
  background:linear-gradient(180deg,rgba(15,18,38,0),rgba(15,18,38,.96) 30%)}
.nav .in{max-width:520px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--green);background:rgba(34,245,115,.08)}

.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:13.5px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120%);background:var(--card2);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:50;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav">
  <div class="in">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Bosh sahifa</button>
    <button data-tab="test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Test</button>
    <button data-tab="rating"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Reyting</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#141832"); tg.setBackgroundColor("#0F1226"); } catch (e) {}
}
const $app = document.getElementById("app");
const LETTERS = "ABCD";
const GEM_COLORS = [["#5BFF9C","#22F573","#0E9F48"],["#9CC4FF","#5498FF","#2B5FC7"],["#FFC29C","#FF8C4C","#C7531A"],["#FF7AB8","#F70077","#A1004E"],["#FFFFFF","#C9B8FF","#7B5CFF"]];
const LEVEL_NAMES = ["Boshlovchi","Izlanuvchi","Malakali","Ekspert","Ustoz"];
const LEVEL_XP = [0,300,1000,3000,7000];

/* ---------- yordamchilar ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("ru-RU").replace(/ /g," ");
const haptic = (t) => { try { t==="ok"||t==="err" ? tg.HapticFeedback.notificationOccurred(t==="ok"?"success":"error") : tg.HapticFeedback.impactOccurred("light"); } catch(e){} };
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function gem(level, cls=""){
  const [a,b,c] = GEM_COLORS[Math.max(0,Math.min(4,level-1))];
  const id = "g"+Math.random().toString(36).slice(2,8);
  return `<svg class="${cls}" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>
  <path d="M32 3 55 20 47 55H17L9 20Z" fill="url(#${id})"/><path d="M32 3 40 20H24Z M9 20h46L32 61Z" fill="#fff" opacity=".16"/><path d="M24 20 32 61 40 20Z" fill="#fff" opacity=".12"/><path d="M32 3 24 20 9 20Z" fill="#fff" opacity=".3"/></svg>`;
}
function avatar(name, photo){
  if (photo) return `<div class="ava"><img src="${esc(photo)}" alt="" referrerpolicy="no-referrer"></div>`;
  const ini = String(name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `<div class="ava">${esc(ini)}</div>`;
}

async function api(path, body){
  const headers = {"Content-Type":"application/json"};
  if (tg && tg.initData) headers.Authorization = "tma " + tg.initData;
  const r = await fetch(path, {method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { const t = await r.text(); throw new Error(t || ("Xato " + r.status)); }
  return r.json();
}

/* ---------- holat ---------- */
const S = { tab:"home", me:null, catalog:null, path:[], fanlar:null, quiz:null, qi:0, answered:null, result:null, filter:"", soni:10, loadingTip:0 };

function setTab(t){
  S.tab = t;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{ haptic(); if (S.quiz && !S.result && b.dataset.tab!=="test") { if(!confirm("Testni tark etasizmi? Javob berilgan savollar hisoblanadi.")) return; finishQuiz(true); } setTab(b.dataset.tab); });

function backBtn(show, fn){
  if (!tg) return;
  tg.BackButton.offClick(backBtn._fn || (()=>{}));
  if (show) { backBtn._fn = fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
}

/* ---------- ekranlar ---------- */
function render(){
  document.getElementById("nav").classList.toggle("hidden", !!(S.quiz && !S.result));
  if (S.tab==="home") return renderHome();
  if (S.tab==="rating") return renderRating();
  return renderTest();
}

function topbar(){
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const name = u ? [u.first_name,u.last_name].filter(Boolean).join(" ") : (S.me?.name || "Mehmon");
  const lv = S.me ? S.me.level.level : 1;
  return `<div class="topbar">${avatar(name, u && u.photo_url)}
    <div class="who"><b>${esc(name)}</b><small>${esc(S.me ? S.me.level.name : "")}${S.me ? " · #" + S.me.rank : ""}</small></div>
    <span class="pill">${gem(lv)}${fmt(S.me?.xp)} XP</span></div>`;
}

function renderHome(){
  backBtn(false);
  const me = S.me;
  if (!me) { $app.innerHTML = topbar() + `<div class="loader"><div class="ring"></div></div>`; return; }
  const L = me.level, lvl = L.level;
  const pct = L.to ? Math.min(100, Math.round(100*(me.xp-L.from)/(L.to-L.from))) : 100;
  const left = L.to ? `${L.next_name} darajasigacha ${fmt(L.to-me.xp)} XP` : "Eng yuqori daraja!";
  const levels = LEVEL_NAMES.map((n,i)=>`${i?'<span class="arrow">▶</span>':''}<div class="l ${lvl>i?'':'off'}">${gem(i+1)}<b>${n}</b>${fmt(LEVEL_XP[i])} XP</div>`).join("");
  const nextDay = me.checked_today ? me.streak : me.streak + 1;
  const days = me.checkin_xp.map((x,i)=>{
    const done = i < me.streak; const next = !me.checked_today && i === me.streak;
    return `<div class="day ${done?'done':''} ${next?'next':''}"><div class="c">+${x}</div>${i+1}-kun</div>`;
  }).join("");
  const hist = me.history.length ? me.history.map(h=>`<div class="item"><div class="t"><b>${esc(h.fan)}</b><small>${esc(h.vaqt)}</small></div>
      <span class="tag ${h.foiz>=me.pass_percent?'g':'b'}">${h.togri}/${h.jami} · ${h.foiz}%</span></div>`).join("")
    : `<div class="empty">Hali test topshirmadingiz. Birinchi testni boshlang!</div>`;
  $app.innerHTML = `<div class="fade">${topbar()}
    <div class="hero"><h1>Attestatsiyaga<span class="g">tayyorlan</span></h1>
      <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></svg>
      <p>${esc(S.catalog ? S.catalog.yil : 2026)}-yilgi rasmiy o'quv dasturlari asosida texnikum fanlaridan test.</p></div>
    <div class="card"><div class="lvl">${gem(lvl,"gem")}<div class="info"><div class="name">${esc(L.name)}</div>
      <div class="meta">${fmt(me.xp)} XP · ${esc(left)}</div><div class="bar"><i id="lvbar"></i></div></div></div>
      <div class="levels">${levels}</div></div>
    <div class="card"><h3>Kunlik check-in</h3><p class="sub">Har kuni kiring va XP to'plang. Ketma-ketlik: ${me.streak} kun</p>
      <div class="days">${days}</div>
      <button class="btn" id="checkin" ${me.checked_today?'disabled':''}>${me.checked_today?'Bugun belgilandi ✓':`Check-in (+${me.checkin_xp[Math.min(nextDay,7)-1]} XP)`}</button></div>
    <div class="stats"><div class="stat"><b>${me.tests}</b><span>Testlar</span></div>
      <div class="stat"><b>${me.avg}%</b><span>O'rtacha</span></div><div class="stat"><b>${fmt(me.correct)}</b><span>To'g'ri javob</span></div></div>
    <button class="btn" id="go" style="margin-bottom:18px">Testni boshlash</button>
    <div class="grp">Oxirgi natijalar</div><div class="list">${hist}</div></div>`;
  requestAnimationFrame(()=>{ const b=document.getElementById("lvbar"); if(b) b.style.width=pct+"%"; });
  document.getElementById("go").onclick = ()=>{ haptic(); setTab("test"); };
  const ci = document.getElementById("checkin");
  ci.onclick = async ()=>{
    ci.disabled = true;
    try { const r = await api("/api/checkin", {}); if (r.ok) { haptic("ok"); toast(`+${r.xp_gained} XP! Ketma-ketlik davom etmoqda`); } await loadMe(); renderHome(); }
    catch(e){ toast(e.message); ci.disabled = false; }
  };
}

/* ----- test: tanlash qadamlari ----- */
function crumbs(title, sub){
  return `<div class="crumbs">${S.path.length?`<button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>`:""}
    <div class="ct"><small>${esc(sub||"")}</small><b>${esc(title)}</b></div></div>`;
}
function goBack(){ haptic(); S.path.pop(); S.filter=""; if (S.path.length<3) S.fanlar=null; render(); }
function bindBack(){ const b=document.getElementById("back"); if(b) b.onclick=goBack; backBtn(S.path.length>0, goBack); }
function searchBox(ph){ return `<input class="search" id="q" placeholder="${esc(ph)}" value="${esc(S.filter)}" autocomplete="off">`; }
function bindSearch(){ const q=document.getElementById("q"); if(!q) return; q.oninput=()=>{ S.filter=q.value; const pos=q.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); }; }
const match = (s) => !S.filter || s.toLowerCase().includes(S.filter.toLowerCase());

function renderTest(){
  if (S.result) return renderResult();
  if (S.quiz) return renderQuestion();
  if (S.loading) return renderLoading();
  const C = S.catalog;
  if (!C) { $app.innerHTML = `<div class="loader"><div class="ring"></div></div>`; return; }
  const [bi, yi, mi, fsel] = S.path;
  let html = "";
  if (bi === undefined) {
    html = crumbs("Bilim sohasi", "1-qadam / 5") + `<div class="list">` + C.sohalar.map((s,i)=>{
      const n = s.y.reduce((a,y)=>a+y.m.length,0);
      return `<button class="item" data-i="${i}"><div class="t"><b>${esc(s.n)}</b><small>${s.y.length} yo'nalish</small></div><span class="n">${n}</span><span class="chev">›</span></button>`;}).join("") + `</div>`;
  } else if (yi === undefined) {
    const s = C.sohalar[bi];
    html = crumbs("Yo'nalish", s.n) + searchBox("Yo'nalishni qidirish") + `<div class="list">` + s.y.map((y,i)=> match(y.k+" "+y.n) ?
      `<button class="item" data-i="${i}"><div class="t"><b>${esc(y.n)}</b><small>${esc(y.k)}</small></div><span class="n">${y.m.length}</span><span class="chev">›</span></button>` : "").join("") + `</div>`;
  } else if (mi === undefined) {
    const y = C.sohalar[bi].y[yi];
    html = crumbs("Mutaxassislik", y.n) + searchBox("Mutaxassislikni qidirish") + `<div class="list">` + y.m.map((m,i)=> match(m.k+" "+m.n) ?
      `<button class="item" data-i="${i}"><div class="t"><b>${esc(m.n)}</b><small>${esc(m.k)}</small></div><span class="n">${m.f?m.f+" fan":"fan yozasiz"}</span><span class="chev">›</span></button>` : "").join("") + `</div>`;
  } else if (fsel === undefined) {
    const m = C.sohalar[bi].y[yi].m[mi];
    if (!S.fanlar) { $app.innerHTML = crumbs("Fanlar", m.n) + `<div class="loader"><div class="ring"></div></div>`; bindBack(); loadFanlar(); return; }
    const F = S.fanlar.fanlar;
    let body = `<div class="card"><h3>Fan nomini o'zingiz yozing</h3><div class="row"><input class="search" id="ownfan" placeholder="Masalan: Elektrotexnika asoslari" style="margin:0"><button class="btn" id="ownbtn" style="flex:0 0 auto;width:auto;padding:0 18px">›</button></div></div>`;
    if (F.length) {
      body = searchBox("Fanni qidirish") + groupFanlar(F) + body;
    } else {
      body = `<div class="empty">Bu mutaxassislik uchun saytda o'quv dasturi hali joylanmagan.</div>` + body;
    }
    html = crumbs("Fanni tanlang", `${m.k} · ${m.n}`) + body;
  } else {
    const m = C.sohalar[bi].y[yi].m[mi];
    const fan = typeof fsel === "number" ? S.fanlar.fanlar[fsel] : {nomi: fsel};
    html = crumbs(fan.nomi, `${m.k} · ${m.n}`) + `<div class="card"><h3>Savollar soni</h3>
      <div class="seg">${[10,20,30].map(n=>`<button data-n="${n}" class="${S.soni===n?'on':''}">${n} ta</button>`).join("")}</div>
      <p class="sub" style="margin:0 0 14px">${fan.dastur?"Savollar shu fanning 2026-yilgi rasmiy o'quv dasturidagi mazmun va o'qitish natijalari asosida tuziladi.":"Savollar fan nomi va mutaxassislik asosida tuziladi."}
      To'g'ri javob uchun +10 XP, ${S.me?S.me.pass_percent:60}% dan yuqori natija uchun +50 XP.</p>
      <button class="btn" id="start">Testni boshlash</button></div>`;
  }
  $app.innerHTML = `<div class="fade">${html}</div>`;
  bindBack(); bindSearch();
  $app.querySelectorAll(".item[data-i]").forEach(el=>el.onclick=()=>{ haptic(); S.path.push(+el.dataset.i); S.filter=""; render(); window.scrollTo(0,0); });
  $app.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{ haptic(); S.path.push(+el.dataset.f); S.filter=""; render(); window.scrollTo(0,0); });
  $app.querySelectorAll("[data-n]").forEach(el=>el.onclick=()=>{ haptic(); S.soni=+el.dataset.n; render(); });
  const own = document.getElementById("ownbtn");
  if (own) own.onclick = ()=>{ const v=document.getElementById("ownfan").value.trim(); if(v.length<3) return toast("Fan nomini to'liqroq yozing"); S.path.push(v); render(); };
  const st = document.getElementById("start"); if (st) st.onclick = startQuiz;
}
function groupFanlar(F){
  const groups = {};
  F.forEach((f,i)=>{ if(!match(f.kod+" "+f.nomi)) return; const g=f.blok||"Fanlar"; (groups[g]=groups[g]||[]).push([f,i]); });
  const keys = Object.keys(groups);
  if (!keys.length) return `<div class="empty">Hech narsa topilmadi</div>`;
  return keys.map(g=>`<div class="grp">${esc(g)}</div><div class="list">` + groups[g].map(([f,i])=>
    `<button class="item" data-f="${i}"><div class="t"><b>${esc(f.nomi)}${f.dastur?'<span class="tag g">dastur</span>':''}</b><small>${esc([f.kod, f.soat && (f.soat+" soat")].filter(Boolean).join(" · "))}</small></div><span class="chev">›</span></button>`).join("") + `</div>`).join("");
}
async function loadFanlar(){
  const [b,y,m] = S.path;
  try { S.fanlar = await api(`/api/fanlar?b=${b}&y=${y}&m=${m}`); } catch(e){ toast(e.message); S.fanlar = {fanlar:[]}; }
  if (S.tab==="test") render();
}

/* ----- test jarayoni ----- */
const TIPS = ["Fan dasturi o'qilmoqda…","Savollar tuzilmoqda…","Javob variantlari tekshirilmoqda…","Izohlar yozilmoqda…","Deyarli tayyor…"];
function renderLoading(){
  backBtn(false);
  $app.innerHTML = `<div class="loader fade"><div class="ring"></div><b>Test tayyorlanmoqda</b><p id="tip">${TIPS[S.loadingTip%TIPS.length]}<br><span style="color:var(--dim)">1–2 daqiqa vaqt olishi mumkin</span></p></div>`;
}
async function startQuiz(){
  haptic();
  const [b,y,m,f] = S.path;
  const body = {b,y,m,soni:S.soni}; if (typeof f === "number") body.f = f; else body.fan = f;
  S.loading = true; S.loadingTip = 0; render();
  const tick = setInterval(()=>{ S.loadingTip++; const t=document.getElementById("tip"); if(t) t.firstChild.textContent = TIPS[Math.min(S.loadingTip,TIPS.length-1)]; }, 9000);
  try { S.quiz = await api("/api/quiz", body); S.qi = 0; S.answered = null; S.result = null; haptic("ok"); }
  catch(e){ toast(e.message || "Xatolik"); haptic("err"); }
  finally { clearInterval(tick); S.loading = false; render(); }
}
function renderQuestion(){
  const Q = S.quiz, q = Q.savollar[S.qi], A = S.answered;
  backBtn(true, ()=>{ if(confirm("Testni yakunlaysizmi?")) finishQuiz(); });
  const prog = Math.round(100*(S.qi + (A?1:0))/Q.savollar.length);
  const opts = q.variantlar.map((v,k)=>{
    let cls = "";
    if (A) { if (k===A.togri) cls="ok"; else if (k===A.javob) cls="bad"; }
    return `<button class="opt ${cls}" data-k="${k}" ${A?"disabled":""}><span class="L">${LETTERS[k]}</span><span>${esc(v)}</span></button>`;
  }).join("");
  const last = S.qi === Q.savollar.length-1;
  $app.innerHTML = `<div class="${A?'':'fade'}">
    <div class="qhead"><span>${esc(Q.fan)}</span><b>${S.qi+1} / ${Q.savollar.length}</b></div>
    <div class="bar" style="margin:0 0 14px"><i style="width:${prog}%"></i></div>
    <div class="qtext">${esc(q.savol)}</div>${opts}
    ${A?`<div class="explain ${A.correct?'':'bad'}"><b>${A.correct?"To'g'ri! +10 XP":"Noto'g'ri"}</b><br>${esc(A.izoh)}</div>
      <button class="btn" id="next">${last?"Natijani ko'rish":"Keyingi savol"}</button>`:""}
    <button class="btn ghost" id="stop" style="margin-top:10px">Testni yakunlash</button></div>`;
  $app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>answer(+el.dataset.k));
  const n = document.getElementById("next"); if (n) n.onclick = ()=>{ haptic(); if (last) finishQuiz(); else { S.qi++; S.answered=null; render(); window.scrollTo(0,0); } };
  document.getElementById("stop").onclick = ()=>{ if(confirm("Testni yakunlaysizmi? Javob berilgan savollar hisoblanadi.")) finishQuiz(); };
}
async function answer(k){
  if (S.answered || S._busy) return;
  S._busy = true;
  $app.querySelectorAll(".opt").forEach(el=>{ el.disabled = true; if(+el.dataset.k===k) el.classList.add("sel"); });
  try { const r = await api("/api/quiz/answer", {id:S.quiz.id, i:S.qi, javob:k}); S.answered = {...r, javob:k}; haptic(r.correct?"ok":"err"); }
  catch(e){ toast(e.message); }
  finally { S._busy = false; render(); }
}
async function finishQuiz(silent){
  try {
    const r = await api("/api/quiz/finish", {id:S.quiz.id});
    if (!r.saved) { S.quiz=null; S.result=null; if(!silent) render(); return; }
    S.result = r; await loadMe();
  } catch(e){ toast(e.message); S.quiz=null; }
  if (!silent) { render(); window.scrollTo(0,0); }
}
function renderResult(){
  backBtn(false);
  const R = S.result, C = 2*Math.PI*70, off = C*(1-R.foiz/100);
  const color = R.passed ? "var(--green)" : "var(--pink)";
  const wrong = R.wrong.length ? `<div class="grp">Xatolar ustida ishlash</div><div class="list">` + R.wrong.map(w=>`<div class="card" style="margin:0"><b style="font-size:14px">${esc(w.savol)}</b>
      <div class="explain" style="margin:8px 0 0"><b>${esc(w.togri_javob)}</b><br>${esc(w.izoh)}</div></div>`).join("") + `</div>` : "";
  $app.innerHTML = `<div class="fade" style="text-align:center">
    <h2 style="font-size:28px;margin-top:6px">${R.passed?"Ajoyib natija!":"Yana harakat qiling"}</h2>
    <div class="score"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" stroke="#232955" stroke-width="12" fill="none"/>
      <circle cx="85" cy="85" r="70" stroke="${color}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 85 85)" id="arc" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>
      <text x="85" y="92" text-anchor="middle" fill="#F7F8F9" font-family="Fraunces,serif" font-weight="800" font-size="36">${R.foiz}%</text>
      <text x="85" y="114" text-anchor="middle" fill="#9AA1C9" font-family="Manrope" font-size="12">${R.togri} / ${R.jami} to'g'ri</text></svg></div>
    <span class="badge ${R.passed?'g':'p'}">${R.passed?"✓ O'tdi":"✗ O'tmadi"} · o'tish bali ${S.me?S.me.pass_percent:60}%</span>
    <div class="card" style="margin-top:16px;text-align:left"><div class="lvl">${gem(R.level.level,"gem")}<div class="info">
      <div class="xpgain">+${R.xp_gained} XP</div><div class="meta">${R.level_up?`🎉 Yangi daraja: <b style="color:var(--white)">${esc(R.level.name)}</b>`:`Jami ${fmt(R.xp)} XP · ${esc(R.level.name)}`}</div></div></div></div>
    <div class="row" style="margin-bottom:6px"><button class="btn ghost" id="home">Bosh sahifa</button><button class="btn" id="again">Yana test</button></div>
    <div style="text-align:left">${wrong}</div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const a=document.getElementById("arc"); if(a) a.style.strokeDashoffset = off; }));
  if (R.passed) haptic("ok");
  document.getElementById("home").onclick = ()=>{ S.quiz=null; S.result=null; S.path=[]; S.fanlar=null; setTab("home"); };
  document.getElementById("again").onclick = ()=>{ S.quiz=null; S.result=null; render(); };
}

/* ----- reyting ----- */
async function renderRating(){
  backBtn(false);
  $app.innerHTML = `<div class="fade"><h1 style="font-size:30px;margin:4px 0 4px">Reyting <span style="color:var(--green)">🏆</span></h1>
    <p style="color:var(--muted);margin:0 0 16px;font-size:13.5px">Eng faol o'qituvchilar. XP test va check-in orqali to'planadi.</p><div id="lb"><div class="loader"><div class="ring"></div></div></div></div>`;
  try {
    const d = await api("/api/leaderboard");
    if (S.tab !== "rating") return;
    const row = (u,i,me) => `<div class="item ${me?'me-row':''}"><span class="rank ${i<3&&!me?'r'+(i+1):''}">${me?d.me.rank:i+1}</span>${avatar(u.name,u.photo)}
      <div class="t"><b>${me?"Siz":esc(u.name)}</b><small>${LEVEL_NAMES[(u.level||1)-1]}</small></div><span class="xp">${gem(u.level||1)}${fmt(u.xp)}</span></div>`;
    const inTop = d.top.some(u=>u.user_id===d.me.user_id);
    document.getElementById("lb").innerHTML = `<div class="list lb">` + (d.top.length ? d.top.map((u,i)=>row(u,i,false)).join("") : `<div class="empty">Hali hech kim XP to'plamagan. Birinchi bo'ling!</div>`) +
      (inTop ? "" : row(d.me,0,true)) + `</div>`;
  } catch(e){ document.getElementById("lb").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- ishga tushirish ---------- */
async function loadMe(){ S.me = await api("/api/me"); }
(async function init(){
  render();
  try {
    await Promise.all([loadMe(), api("/api/catalog").then(c=>S.catalog=c)]);
  } catch(e) {
    $app.innerHTML = `<div class="loader"><b>Ulanib bo'lmadi</b><p>${esc(e.message)}<br>Ilovani Telegram bot orqali oching.</p></div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
