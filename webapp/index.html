<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Attestatsiyaga tayyorlov</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1226; --card:#1B2042; --card2:#222850; --line:#2C3363;
  --green:#22F573; --green-d:#12C95A; --pink:#F70077; --orange:#FF8C4C; --blue:#5498FF;
  --white:#F7F8F9; --muted:#9AA1C9; --dim:#6B729E;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--white);background:var(--bg);min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:-20% -30% auto -30%;height:120%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 15% 10%,rgba(84,152,255,.22),transparent 70%),radial-gradient(35% 25% at 90% 35%,rgba(34,245,115,.08),transparent 70%),linear-gradient(180deg,#141832 0%,#0F1226 60%)}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:520px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-b))}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--blue),#8a5cff);overflow:hidden;font-size:15px}
.ava img{width:100%;height:100%;object-fit:cover}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pill.g{border-color:rgba(34,245,115,.5);color:var(--green)}
.card{background:linear-gradient(180deg,rgba(34,40,80,.92),rgba(27,32,66,.92));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.grp{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:800;font-size:15px;background:var(--green);color:#06210F;box-shadow:0 8px 24px rgba(34,245,115,.2);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--white);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:11px}
.row{display:flex;gap:10px}.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.item:active{background:var(--card2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;font-size:14px}
.item .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.item .n{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.chev{color:var(--dim)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;vertical-align:1px}
.tag.g{background:rgba(34,245,115,.14);color:var(--green)}
.tag.b{background:rgba(84,152,255,.15);color:var(--blue)}
.tag.p{background:rgba(247,0,119,.14);color:#ff5aa8}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.crumbs .ct{min-width:0}
.crumbs .ct small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .ct b{font-family:Fraunces,serif;font-size:20px;display:block;line-height:1.15}
.search,.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#12163A;color:var(--white);margin-bottom:10px;outline:none}
.search:focus,.inp:focus{border-color:var(--green)}
.seg{display:flex;background:#12163A;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--green);color:#06210F}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.kpi b{display:block;font-family:Fraunces,serif;font-size:22px;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.ready{display:flex;gap:16px;align-items:center}
.ready svg{width:104px;height:104px;flex:none}
.ready .v{font-family:Fraunces,serif;font-size:20px}
.bar{height:8px;border-radius:8px;background:#0E1230;overflow:hidden;border:1px solid var(--line);position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--green);transition:width .7s}
.bar i.low{background:var(--pink)}.bar i.mid{background:var(--orange)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--white);opacity:.55}
.subj{padding:12px 0;border-top:1px solid var(--line)}
.subj:first-child{border-top:0;padding-top:0}
.subj .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin-bottom:6px}
.subj .h span{white-space:nowrap}
.subj .m{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:6px}
.trend{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.trend div{flex:1;border-radius:6px 6px 2px 2px;min-height:4px}
.trend div.ok{background:var(--green)}.trend div.no{background:var(--pink)}
.weak{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.weak:first-child{border-top:0;padding-top:0}
.weak .pc{font-weight:800;color:#ff5aa8;min-width:42px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.mode.on{border-color:var(--green);background:rgba(34,245,115,.06)}
.mode .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#12163A;flex:none;font-size:17px}
.mode b{display:block;font-size:14px}.mode small{color:var(--muted);font-size:12px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qhead b{color:var(--white)}
.qhead>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qhead>b{white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--white)}
.timer.warn{color:var(--orange)}
.qtext{font-size:17px;font-weight:700;line-height:1.4;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:14.5px}
.opt .L{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;background:#12163A;color:var(--muted)}
.opt.sel{border-color:var(--blue)}.opt.sel .L{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:rgba(34,245,115,.1)}.opt.ok .L{background:var(--green);color:#06210F}
.opt.bad{border-color:var(--pink);background:rgba(247,0,119,.1)}.opt.bad .L{background:var(--pink);color:#fff}
.explain{border-left:3px solid var(--green);background:rgba(34,245,115,.06);padding:10px 12px;border-radius:0 12px 12px 0;color:#CFE9DA;font-size:13.5px;margin:6px 0 14px}
.explain.bad{border-color:var(--pink);background:rgba(247,0,119,.07);color:#F2C9DC}
.loader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 12px}
.ring{width:48px;height:48px;border-radius:50%;border:4px solid rgba(34,245,115,.15);border-top-color:var(--green);animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);margin:8px 0 0;font-size:13.5px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.plan{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.plan.on{border-color:var(--green);background:rgba(34,245,115,.06)}
.plan b{display:block;font-size:14px}
.plan .pr{font-family:Fraunces,serif;font-size:22px;margin:6px 0 2px}
.plan small{color:var(--muted);font-size:12px}
.plan .best{position:absolute;top:-9px;right:10px;background:var(--green);color:#06210F;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px}
.cardno{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#2a3270,#1c2150);border:1px solid var(--line);border-radius:16px;padding:16px}
.cardno .num{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.05em;font-weight:700}
.cardno small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.steps li{margin:4px 0}.steps b{color:var(--white)}
.upload{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;color:var(--muted);font-size:13.5px}
.upload.has{border-color:var(--green);color:var(--white)}
.lock{font-size:12px;color:var(--orange);font-weight:800}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}
.choice.on{border-color:var(--green);background:rgba(34,245,115,.06)}
.choice b{display:block;font-size:14.5px}.choice small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.note{border-left:3px solid var(--blue);background:rgba(84,152,255,.08);padding:10px 12px;border-radius:0 12px 12px 0;color:#C9D8F5;font-size:12.5px;margin:0 0 12px}
.steps-top{display:flex;gap:6px;margin:0 0 14px}.steps-top i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps-top i.on{background:var(--green)}
.scale{position:relative;height:12px;border-radius:12px;background:#0E1230;border:1px solid var(--line);margin:22px 0 26px}
.scale .fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px}
.scale .tick{position:absolute;top:-18px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.scale .tick::after{content:"";position:absolute;left:50%;top:16px;width:2px;height:16px;background:var(--white);opacity:.5}
.scale .you{position:absolute;top:16px;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-bottom:12px}.kv span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--green)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 16px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(15,18,38,0),rgba(15,18,38,.96) 30%)}
.nav .in{max-width:520px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--green);background:rgba(34,245,115,.08)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13.5px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:50;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:900px){ .app{max-width:760px;padding-top:28px} .nav .in{max-width:760px} .kpis{gap:14px} .plans{gap:14px} }
.login{max-width:420px;margin:8vh auto 0;text-align:center}
.login h1{font-size:30px;margin:14px 0 8px}
.login .w{display:flex;justify-content:center;min-height:48px;margin:22px 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"><div class="in">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tahlil</button>
  <button data-tab="test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Test</button>
  <button data-tab="premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/></svg>Premium</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const tg0 = window.Telegram && Telegram.WebApp;
const tg = tg0 && tg0.initData ? tg0 : null;   // Telegram ichida ochilganmi
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#141832"); tg.setBackgroundColor("#0F1226"); } catch (e) {} }
const $app = document.getElementById("app");
const LETTERS = "ABCD";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("ru-RU").replace(/ /g," ");
const pc = (a,b) => b ? Math.round(100*a/b) : 0;
// O'tish foizi nizom (44-band) bo'yicha: toifani saqlash uchun kerakli jami ball − 1-bosqich bali, 80 ga nisbatan
const PASS = () => { const p=S.me?.profil, nz=S.me?.nizom;
  if (p && p.toifa && nz) { const ch=nz.toifalar[p.toifa].chegaralar, need=ch[ch.length-2].ball, b1=p.bosqich1??15;
    return Math.max(0, Math.min(100, Math.ceil(100*(need-b1)/nz.bosqich2_max))); }
  return S.me?.pass_percent || 60; };
const PASS_NOTE = () => { const p=S.me?.profil; return p && p.toifa ? `toifangiz uchun ${PASS()}%` : `o'tish bali ${PASS()}%`; };
const cls = p => p >= PASS() ? "" : (p >= 40 ? "mid" : "low");
const haptic = t => { try { t==="ok"||t==="err" ? tg.HapticFeedback.notificationOccurred(t==="ok"?"success":"error") : tg.HapticFeedback.impactOccurred("light"); } catch(e){} };
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800); }
function avatar(name, photo){ if (photo) return `<div class="ava"><img src="${esc(photo)}" alt="" referrerpolicy="no-referrer"></div>`; const ini=String(name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); return `<div class="ava">${esc(ini)}</div>`; }
const mmss = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
class PayErr extends Error {}
async function api(path, body, form){
  const headers = {}; if (!form) headers["Content-Type"]="application/json";
  if (tg) headers.Authorization = "tma " + tg.initData;
  else if (store.get("web_token")) headers.Authorization = "web " + store.get("web_token");
  const r = await fetch(path, {method: body||form ? "POST" : "GET", headers, body: form || (body ? JSON.stringify(body) : undefined)});
  if (!r.ok) { let t = await r.text(); try { const j = JSON.parse(t); t = j.message || j.text || t; } catch(e){}
    if (r.status===402) throw new PayErr(t);
    if (r.status===401 && !tg) { store.set("web_token", null); setTimeout(renderLogin, 0); }
    throw new Error(t || ("Xato " + r.status)); }
  return r.json();
}
const S = { tab:"home", me:null, catalog:null, bank:[], bankSel:null, path:[], fanlar:null, filter:"", soni:10, rejim:"mashq",
            quiz:null, qi:0, answered:null, picks:{}, result:null, loading:false, plan:"3oy", chek:null, timerH:null, wiz:null };

function setTab(t){ S.tab=t; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t)); render(); window.scrollTo(0,0); }
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{ haptic(); if (S.quiz && !S.result) { if(!confirm("Testni yakunlaysizmi? Javob berilgan savollar hisoblanadi.")) return; finishQuiz(); } setTab(b.dataset.tab); });
function backBtn(show, fn){ if (!tg) return; tg.BackButton.offClick(backBtn._fn||(()=>{})); if (show) { backBtn._fn=fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide(); }
function render(){
  const wiz = S.wiz || (S.me && !S.me.profil && S.catalog);
  document.getElementById("nav").classList.toggle("hidden", !!(S.quiz && !S.result) || !!wiz);
  if (wiz) { if (!S.wiz) S.wiz = {step:1, path:[]}; return renderWizard(); }
  if (S.tab==="home") return renderHome();
  if (S.tab==="premium") return renderPremium();
  return renderTest();
}
function topbar(){
  const u = tg ? tg.initDataUnsafe && tg.initDataUnsafe.user : {first_name: store.get("web_name")||"", photo_url: store.get("web_photo")||""};
  const name = (u && u.first_name) ? [u.first_name,u.last_name].filter(Boolean).join(" ") : (S.me?.name || "Mehmon");
  const st = !S.me ? "" : S.me.premium ? `<span class="pill g">💎 ${esc(S.me.premium_until)} gacha</span>` : `<span class="pill">Bepul: ${S.me.free_left}/${S.me.free_questions}</span>`;
  return `<div class="topbar">${avatar(name, u && u.photo_url)}<div class="who"><b>${esc(name)}</b><small>Attestatsiyaga tayyorlov</small></div>${st}</div>`;
}
function daysLeft(){ const d = new Date((S.me?.imtihon_sanasi||"2026-12-04")+"T09:00:00+05:00"); return Math.ceil((d - new Date())/864e5); }

/* ================= NIZOM BO'YICHA SOZLASH ================= */
const NZ = () => S.me.nizom;
function wizBack(){ const W=S.wiz; if (W.step===2 && W.path.length) { W.path.pop(); W.fanlar=null; } else if (W.step>1) W.step--; else if (S.me.profil) S.wiz=null; render(); }
async function wizSave(){
  const W=S.wiz;
  try { await api("/api/profile",{lavozim:W.lavozim, toifa:W.toifa, sid:W.sid, fan_nomi:W.fan_nomi, mutax:W.mutax, bosqich1:W.bosqich1}); }
  catch(e){ return toast(e.message); }
  haptic("ok"); S.wiz=null; await loadMe(); setTab("home");
}
function renderWizard(){
  const W=S.wiz, L=NZ().lavozimlar, T=NZ().toifalar;
  backBtn(W.step>1 || !!S.me.profil, wizBack);
  const head = (t,sub) => `<div class="steps-top">${[1,2,3].map(i=>`<i class="${i<=W.step?'on':''}"></i>`).join("")}</div>

function attestCard(){
  const p=S.me.profil; if (!p) return "";
  const L=NZ().lavozimlar, T=NZ().toifalar, st = p.sid ? subjStat(p.sid) : null;
  const acc = st && st.jami>=5 ? st.togri/st.jami : null;

  let verdict = "", scale = "";
  if (p.toifa) {

    if (jami!==null) { const r = ch.find(c=>jami>=c.ball); verdict = r ? r.natija : ""; }

    scale = `<div class="scale"><div class="fill" style="width:${jami??0}%;background:${col}"></div>${ch.filter(c=>c.ball>0).map(c=>`<span class="tick" style="left:${c.ball}%">${c.ball}</span>`).join("")}${jami!==null?`<span class="you" style="left:${Math.min(96,Math.max(4,jami))}%;color:${col}">siz: ${jami}</span>`:""}</div>`;
  }
  const usta = p.lavozim==="usta" ? `<p class="note" style="margin-top:4px">Ishlab chiqarish ta'limi ustalari Nizomning 5-bandiga ko'ra attestatsiyaga jalb etilmaydi. Bu yerdagi natijalar — mashq uchun.</p>` : "";
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3>Mening attestatsiyam</h3><button class="btn sm ghost" id="editP">O'zgartirish</button></div>

    ${p.sid ? `<div class="kpis" style="margin-bottom:4px"><div class="kpi"><b>${b1??"—"}<small style="font-size:12px;color:var(--muted)">/20</small></b><span>1-bosqich (kengash)</span></div>
      <div class="kpi"><b>${b2??"—"}<small style="font-size:12px;color:var(--muted)">/80</small></b><span>2-bosqich prognozi</span></div><div class="kpi"><b>${jami??"—"}</b><span>jami / 100</span></div></div>
      ${scale}${jami!==null?`<p class="sub" style="margin:0 0 12px">Prognoz: <b style="color:var(--white)">${esc(verdict)}</b>. 2-bosqich bali shu fandagi to'g'ri javoblaringiz ulushidan hisoblandi (${st.jami} ta javob).</p>`:`<p class="sub">Prognoz uchun shu fandan kamida 5 ta savolga javob bering.</p>`}
      <button class="btn" id="goFan">Attestatsiya fanidan test</button>`
    : `<p class="note">"${esc(p.fan_nomi||"")}" fani bo'yicha tayyor savollar hali yo'q. Nizomga ko'ra natija fan sohasidagi boshqa fanlarga ham tegishli bo'lgani uchun "Test" bo'limidagi mutaxassislik fanlaridan tayyorlanishingiz mumkin.</p>`}</div>`;
}

    const foundSoon = S.filter ? SOON.filter(b => nrm(b.nomi+" "+b.kat).includes(nrm(S.filter.trim()))) : [];
    const kats = [...new Set([...S.bank, ...SOON].sort((a,b)=>(a.kat_n??99)-(b.kat_n??99)).map(b=>b.kat))];
    html = crumbs("Fanni tanlang", `${S.bank.length} ta fan · nomini yozib qidiring`)
      + searchBox("🔍 Fan nomini yozing: dasturlash, lotin, temir yo'l…")
      + (S.filter
          ? (found.length||foundSoon.length ? `<div class="list" style="margin-bottom:6px">${found.map(item).join("")}${foundSoon.map(soonItem).join("")}</div>` : `<div class="empty">Bunday fan topilmadi. Boshqacha yozib ko'ring.</div>`)
          : (mine ? `<div class="grp">Sizning attestatsiya faningiz</div><div class="list" style="margin-bottom:6px">${item(mine)}</div>` : (p ? "" : `<button class="btn ghost" id="setP" style="margin-bottom:12px">Nizom bo'yicha sozlash</button>`))
            + kats.map(k => { const arr = S.bank.filter(b=>b.kat===k && b.id!==(mine&&mine.id)), ss = SOON.filter(b=>b.kat===k); return arr.length||ss.length ? `<div class="grp">${esc(k)}</div><div class="list" style="margin-bottom:6px">${arr.map(item).join("")}${ss.map(soonItem).join("")}</div>` : ""; }).join(""))
;
  } else if (yi === undefined) {
    const s = C.sohalar[bi];
    html = crumbs("Yo'nalish", s.n) + searchBox("Qidirish") + `<div class="list">` + s.y.map((y,i)=> match(y.k+" "+y.n) ? `<button class="item" data-i="${i}"><div class="t"><b>${esc(y.n)}</b><small>${esc(y.k)}</small></div><span class="n">${y.m.length}</span><span class="chev">›</span></button>` : "").join("") + `</div>`;
  } else if (mi === undefined) {
    const y = C.sohalar[bi].y[yi];
    html = crumbs("Mutaxassislik", y.n) + searchBox("Qidirish") + `<div class="list">` + y.m.map((m,i)=> match(m.k+" "+m.n) ? `<button class="item" data-i="${i}"><div class="t"><b>${esc(m.n)}</b><small>${esc(m.k)}</small></div><span class="n">${m.f?m.f+" fan":""}</span><span class="chev">›</span></button>` : "").join("") + `</div>`;
  } else {
    const m = C.sohalar[bi].y[yi].m[mi];
    if (!S.fanlar) { $app.innerHTML = crumbs("Fanlar", m.n) + `<div class="loader"><div class="ring"></div></div>`; bindBack(); loadFanlar(); return; }
    const F = S.fanlar.fanlar.filter(f=>match(f.kod+" "+f.nomi));
    const withB = F.filter(f=>f.bank), noB = F.filter(f=>!f.bank);
    html = crumbs("Fanni tanlang", `${m.k} · ${m.n}`) + searchBox("Fanni qidirish")
      + (withB.length ? `<div class="grp">Tayyor savollari bor</div><div class="list">` + withB.map(f=>`<button class="item" data-bk="${esc(f.bank)}"><div class="t"><b>${esc(f.nomi)}</b><small>${esc([f.kod, f.soat&&f.soat+" soat"].filter(Boolean).join(" · "))}</small></div><span class="tag g">savollar bor</span><span class="chev">›</span></button>`).join("") + `</div>` : "")
      + (noB.length ? `<div class="grp">Tayyor savollar hali yo'q</div><div class="list">` + noB.map(f=>`<div class="item" style="opacity:.55"><div class="t"><b>${esc(f.nomi)}</b><small>${esc(f.kod||"")}</small></div></div>`).join("") + `</div>` : "")
      + (!S.fanlar.fanlar.length ? `<div class="empty">Bu mutaxassislik uchun saytda o'quv dasturi hali joylanmagan. "Attestatsiya fanlari" ro'yxatidan foydalaning.</div>` : "");
  }
  $app.innerHTML = `<div class="fade">${html}</div>`;
  bindBack(); bindSearch();
  $app.querySelectorAll(".item[data-i]").forEach(el=>el.onclick=()=>{ haptic(); S.path.push(+el.dataset.i); S.filter=""; render(); window.scrollTo(0,0); });
  const sp=document.getElementById("setP"); if (sp) sp.onclick=()=>{ haptic(); editProfile(); };
  $app.querySelectorAll("[data-soon]").forEach(el=>el.onclick=()=>{ haptic(); toast("«"+el.dataset.soon+"» bo'yicha savollar tez orada qo'shiladi"); });
  $app.querySelectorAll("[data-bank],[data-bk]").forEach(el=>el.onclick=()=>{ haptic(); S.bankSel=el.dataset.bank||el.dataset.bk; S.rejim="mashq"; S.filter=""; render(); window.scrollTo(0,0); });
  $app.querySelectorAll("[data-n]:not([disabled])").forEach(el=>el.onclick=()=>{ haptic(); S.soni=+el.dataset.n; render(); });
  $app.querySelectorAll("[data-mode]").forEach(el=>el.onclick=()=>{ haptic(); const id=el.dataset.mode; if (id!=="mashq" && !S.me?.premium) { toast("Bu rejim premium foydalanuvchilar uchun"); return setTab("premium"); } S.rejim=id; render(); });
  const st = document.getElementById("start"); if (st) st.onclick = startQuiz;
}
async function loadFanlar(){ const [b,y,m]=S.path; try { S.fanlar = await api(`/api/fanlar?b=${b}&y=${y}&m=${m}`); } catch(e){ toast(e.message); S.fanlar={fanlar:[]}; } if (S.tab==="test") render(); }

/* ================= TEST: jarayon ================= */
async function startQuiz(){
  haptic(); S.loading = true; render();
  try {
    S.quiz = await api("/api/quiz", {bank:S.bankSel, soni:S.soni, rejim:S.rejim});
    S.qi=0; S.answered=null; S.picks={}; S.result=null; S.quiz.t0=Date.now();
    if (S.quiz.vaqt_limit) startTimer();
  } catch(e){ toast(e.message); S.loading=false; if (e instanceof PayErr) return setTab("premium"); }
  S.loading=false; render();
}
function startTimer(){ clearInterval(S.timerH); S.timerH = setInterval(()=>{ if (!S.quiz||S.result) return clearInterval(S.timerH);
  const left = Math.max(0, Math.round(S.quiz.vaqt_limit - (Date.now()-S.quiz.t0)/1000)); const el=document.getElementById("timer");
  if (el) { el.textContent = mmss(left); el.classList.toggle("warn", left<300); }
  if (left<=0) { clearInterval(S.timerH); toast("Vaqt tugadi"); finishQuiz(); } }, 1000); }
function renderQuestion(){
  const Q=S.quiz, q=Q.savollar[S.qi], A=S.answered, exam = Q.rejim==="imtihon", n=Q.savollar.length;
  backBtn(true, ()=>{ if(confirm("Testni yakunlaysizmi?")) finishQuiz(); });
  const pick = S.picks[S.qi];
  const opts = q.variantlar.map((v,k)=>{ let c=""; if (exam) { if (pick===k) c="sel"; } else if (A) { if (k===A.togri) c="ok"; else if (k===A.javob) c="bad"; }
    return `<button class="opt ${c}" data-k="${k}" ${(!exam&&A)?"disabled":""}><span class="L">${LETTERS[k]}</span><span>${esc(v)}</span></button>`; }).join("");
  const last = S.qi===n-1, done = Object.keys(S.picks).length;
  const left = exam ? Math.max(0, Math.round(Q.vaqt_limit-(Date.now()-Q.t0)/1000)) : 0;
  $app.innerHTML = `<div class="${A?'':'fade'}">
    <div class="qhead"><span>${esc(Q.fan)}${exam?' · imtihon':''}</span>${exam?`<span class="timer ${left<300?'warn':''}" id="timer">${mmss(left)}</span>`:""}<b>${S.qi+1} / ${n}</b></div>
    <div class="bar" style="margin:0 0 14px"><i style="width:${pc(done,n)}%"></i></div>
    ${q.bolim?`<span class="tag b">${esc(q.bolim)}</span>`:""}
    <div class="qtext">${esc(q.savol)}</div>${opts}
    ${(!exam && A)?`<div class="explain ${A.correct?'':'bad'}"><b>${A.correct?"To'g'ri":"Noto'g'ri"}</b><br>${esc(A.izoh)}</div>`:""}
    ${exam ? `<div class="row"><button class="btn ghost" id="prev" ${S.qi===0?"disabled":""}>‹ Oldingi</button><button class="btn" id="next">${last?"Yakunlash":"Keyingi ›"}</button></div>`
           : (A?`<button class="btn" id="next">${last?"Natijani ko'rish":"Keyingi savol"}</button>`:"")}
    <button class="btn ghost" id="stop" style="margin-top:10px">Testni yakunlash</button></div>`;
  $app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>answer(+el.dataset.k));
  const nx=document.getElementById("next"); if (nx) nx.onclick=()=>{ haptic(); if (last) { if (exam && done<n && !confirm(`${n-done} ta savolga javob berilmagan. Yakunlaysizmi?`)) return; finishQuiz(); } else { S.qi++; S.answered=null; render(); window.scrollTo(0,0); } };
  const pv=document.getElementById("prev"); if (pv) pv.onclick=()=>{ S.qi--; render(); };
  document.getElementById("stop").onclick=()=>{ if(confirm("Testni yakunlaysizmi? Javob berilgan savollar hisoblanadi.")) finishQuiz(); };
}
async function answer(k){
  const exam = S.quiz.rejim==="imtihon";
  if (exam && S.picks[S.qi]!==undefined) return toast("Imtihonda tanlangan javobni o'zgartirib bo'lmaydi");
  if (S._busy || (!exam && S.answered)) return;
  S._busy=true;
  try {
    const r = await api("/api/quiz/answer", {id:S.quiz.id, i:S.qi, javob:k});
    S.picks[S.qi]=k;
    if (!exam) { S.answered={...r, javob:k}; haptic(r.correct?"ok":"err"); }
    else { haptic(); if (S.qi < S.quiz.savollar.length-1) { S.qi++; } }
  } catch(e){ toast(e.message); if (e instanceof PayErr) { S._busy=false; return finishQuiz(); } }
  S._busy=false; render();
}
async function finishQuiz(){
  clearInterval(S.timerH);
  try { const r = await api("/api/quiz/finish", {id:S.quiz.id}); if (!r.saved) { S.quiz=null; S.result=null; render(); return; } S.result=r; await loadMe(); }
  catch(e){ toast(e.message); S.quiz=null; }
  render(); window.scrollTo(0,0);
}
function renderResult(){
  backBtn(false);
  const R=S.result, P=PASS(); R.passed = R.foiz >= P;
  const C=2*Math.PI*70, col=R.passed?"var(--green)":"var(--pink)", hasBall = R.ball!==null && R.ball!==undefined;
  const bol = R.bolimlar.map(b=>{ const p=pc(b.togri,b.jami); return `<div class="subj"><div class="h"><div>${esc(b.bolim)}</div><span>${b.togri}/${b.jami}</span></div><div class="bar"><i class="${cls(p)}" style="width:${p}%"></i><span class="mark" style="left:${P}%"></span></div></div>`; }).join("");
  const weak = R.bolimlar.filter(b=>pc(b.togri,b.jami)<P).map(b=>b.bolim);
  const wrong = R.xatolar.length ? `<div class="grp">Xatolar tahlili (${R.xatolar.length})</div><div class="list">` + R.xatolar.map(w=>`<div class="card" style="margin:0">${w.bolim?`<span class="tag b">${esc(w.bolim)}</span>`:""}<b style="display:block;font-size:14px;margin-top:6px">${esc(w.savol)}</b>
      <p class="sub" style="margin:8px 0 4px">Sizning javobingiz: <span style="color:#ff5aa8">${esc(w.sizning)}</span></p>
      <div class="explain" style="margin:4px 0 0"><b>${esc(w.togri_javob)}</b><br>${esc(w.izoh)}</div></div>`).join("") + `</div>` : "";
  $app.innerHTML = `<div class="fade">
    <h2 style="font-size:26px;margin:6px 0 2px;text-align:center">${R.rejim==="imtihon"?"Sinov imtihoni natijasi":R.rejim==="xatolar"?"Xatolar ustida ishlash":"Test natijasi"}</h2>
    <div style="display:grid;place-items:center;margin:8px 0 6px"><svg viewBox="0 0 170 170" style="width:160px;height:160px"><circle cx="85" cy="85" r="70" stroke="#232955" stroke-width="12" fill="none"/>
      <circle cx="85" cy="85" r="70" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-R.foiz/100)}" transform="rotate(-90 85 85)"/>
      <text x="85" y="92" text-anchor="middle" fill="#F7F8F9" font-family="Fraunces,serif" font-weight="800" font-size="34">${R.foiz}%</text>
      <text x="85" y="114" text-anchor="middle" fill="#9AA1C9" font-family="Manrope" font-size="12">${R.togri} / ${R.jami} to'g'ri</text></svg></div>
    <div class="kpis"><div class="kpi"><b>${hasBall?R.ball+"/"+R.jami*2:R.togri}</b><span>${hasBall?"ball":"to'g'ri javob"}</span></div>
      <div class="kpi"><b style="color:${col}">${R.passed?"O'tdi":"O'tmadi"}</b><span>${esc(PASS_NOTE())}</span></div><div class="kpi"><b>${mmss(R.vaqt)}</b><span>sarflangan vaqt</span></div></div>
    ${weak.length?`<div class="card"><h3>Tavsiya</h3><p class="sub" style="margin:0">Takrorlang: <b style="color:var(--white)">${weak.map(esc).join(", ")}</b>.${S.me?.premium?" So'ng \"Xatolar ustida ishlash\" rejimida xatolaringizni qayta yeching.":""}</p></div>`:""}
    ${bol?`<div class="card"><h3>Bo'limlar bo'yicha</h3>${bol}</div>`:""}
    ${R.free_left===0 && !R.premium ? `<div class="card" style="border-color:rgba(255,140,76,.45)"><h3>Bepul savollar tugadi</h3><p class="sub">Tayyorgarlikni davom ettirish uchun premium oling.</p><button class="btn" id="toPrem">Premium olish</button></div>` : ""}
    <div class="row" style="margin-bottom:6px"><button class="btn ghost" id="home">Tahlil</button><button class="btn" id="again">Yana test</button></div>
    ${wrong}</div>`;
  if (R.passed) haptic("ok");
  const tp=document.getElementById("toPrem"); if (tp) tp.onclick=()=>{ S.quiz=null; S.result=null; setTab("premium"); };
  document.getElementById("home").onclick=()=>{ S.quiz=null; S.result=null; S.path=[]; S.fanlar=null; S.bankSel=null; setTab("home"); };
  document.getElementById("again").onclick=()=>{ S.quiz=null; S.result=null; if (S.rejim==="xatolar") S.rejim="mashq"; render(); };
}

/* ================= PREMIUM ================= */
function renderPremium(){
  backBtn(false);
  const me=S.me; if (!me) { $app.innerHTML = `<div class="loader"><div class="ring"></div></div>`; return; }
  const plan = me.tariflar.find(p=>p.id===S.plan) || me.tariflar[0];
  const plans = me.tariflar.map(p=>`<button class="plan ${plan.id===p.id?'on':''}" data-plan="${p.id}">${p.id==="3oy"?'<span class="best">foydali</span>':""}<b>${esc(p.nomi)}</b><div class="pr">${esc(p.narx_text)}</div><small>${p.kun} kun to'liq kirish</small></button>`).join("");
  const card = (me.karta||"").replace(/(\d{4})(?=\d)/g,"$1 ");
  $app.innerHTML = `<div class="fade">${topbar()}
    <h1 style="font-size:28px;margin:2px 0 6px">Premium</h1>
    <p class="sub">${me.premium ? `Premium faol: <b style="color:var(--green)">${esc(me.premium_until)}</b> gacha. Muddatni uzaytirish uchun yangi kod kiritishingiz mumkin.` : `Bepul sinov: ${me.free_questions} ta savol (${me.free_left} ta qoldi).`}</p>
    <div class="card"><h3>Premium imkoniyatlari</h3><ul class="steps">
      <li><b>Cheksiz mashq</b> — barcha ${S.bank.length} ta fan bo'yicha</li>
      <li><b>Sinov imtihoni</b> — 40 savol, 80 daqiqa, rasmiy 80 ballik tizim</li>
      <li><b>Xatolar ustida ishlash</b> — faqat xato javob bergan savollaringiz</li>
      <li><b>To'liq tahlil</b> — fanlar va bo'limlar kesimida zaif mavzular</li></ul></div>
    <div class="grp">1. Tarifni tanlang</div><div class="plans">${plans}</div>
    <div class="grp">2. Kartaga to'lov qiling</div>
    <div class="cardno"><div><div class="num">${esc(card||"—")}</div><small>${esc(me.karta_egasi||"")}</small></div><button class="btn sm" id="copy">Nusxa</button></div>
    <p class="sub" style="margin-top:10px">Shu kartaga <b style="color:var(--white)">${esc(plan.narx_text)}</b> o'tkazing (${esc(plan.nomi)}).</p>
    <div class="grp">3. Chek rasmini yuboring</div>
    ${me.pending ? `<div class="card"><h3>⏳ Chekingiz tekshirilmoqda</h3><p class="sub" style="margin:0">Admin tasdiqlagach, Telegram'da sizga faollashtirish kodi keladi.</p></div>` : `
    <label class="upload ${S.chek?'has':''}" for="chek">${S.chek?`✅ ${esc(S.chek.name)}`:"📎 To'lov cheki rasmini tanlang (skrinshot)"}</label>
    <input type="file" id="chek" accept="image/*,application/pdf" class="hidden">
    <button class="btn" id="send" ${S.chek?"":"disabled"}>Chekni yuborish</button>
    <p class="sub" style="margin-top:8px">Chekni bot chatiga rasm qilib ham yuborishingiz mumkin.</p>`}
    <div class="grp">4. Faollashtirish kodi</div>
    <div class="card"><p class="sub">Admin yuborgan kodni kiriting (masalan: ABCD-EFGH-JKLM)</p>
      <input class="inp" id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em">
      <button class="btn" id="redeem">Faollashtirish</button></div>
    ${me.admin?`<p class="sub" style="text-align:center">Savollar bo'yicha: ${esc(me.admin)}</p>`:""}
    ${!tg?`<button class="btn ghost" id="logout" style="margin-top:8px">Chiqish</button>`:""}</div>`;
  $app.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{ haptic(); S.plan=b.dataset.plan; renderPremium(); });
  const lo=document.getElementById("logout"); if (lo) lo.onclick=()=>{ store.set("web_token",null); store.set("web_name",null); store.set("web_photo",null); location.reload(); };
  document.getElementById("copy").onclick=async()=>{ try { await navigator.clipboard.writeText(me.karta); toast("Karta raqami nusxalandi"); } catch(e){ toast(me.karta); } };
  const f=document.getElementById("chek"); if (f) f.onchange=()=>{ S.chek=f.files[0]||null; renderPremium(); };
  const sd=document.getElementById("send"); if (sd) sd.onclick=async()=>{ sd.disabled=true; sd.textContent="Yuborilmoqda…";
    const fd=new FormData(); fd.append("tarif", plan.id); fd.append("chek", S.chek, S.chek.name);
    try { await api("/api/payment", null, fd); S.chek=null; haptic("ok"); toast("Chek yuborildi. Admin tasdiqlagach kod keladi."); await loadMe(); } catch(e){ toast(e.message); }
    renderPremium(); };
  document.getElementById("redeem").onclick=async()=>{ const c=document.getElementById("code").value.trim(); if (c.length<8) return toast("Kodni to'liq kiriting");
    try { const r=await api("/api/code",{code:c}); haptic("ok"); toast(r.message); await loadMe(); renderPremium(); } catch(e){ haptic("err"); toast(e.message); } };
}

async function loadMe(){ S.me = await api("/api/me"); }

/* ================= BRAUZER: Telegram orqali kirish ================= */
async function renderLogin(){
  document.getElementById("nav").classList.add("hidden");
  let bu = ""; try { bu = (await (await fetch("/api/public")).json()).bot_username; } catch(e){}
  $app.innerHTML = `<div class="login fade"><div class="ava" style="width:64px;height:64px;margin:0 auto;font-size:26px">🎓</div>
    <h1>Attestatsiyaga tayyorlov</h1>
    <p class="sub">Texnikum o'qituvchilari uchun: nizom bo'yicha fanlar, 2026-yilgi o'quv dasturlari asosidagi testlar va tahlil. Hisob, premium va natijalar Telegram bot bilan bir xil.</p>
    <div class="w" id="tgw"></div>
    <p class="sub" style="font-size:12px">Kirish Telegram'ning rasmiy oynasi orqali bo'ladi. Parolingiz so'ralmaydi.</p>
    ${bu?`<p class="sub">Telegram'da: <a href="https://t.me/${esc(bu)}" style="color:var(--green)">@${esc(bu)}</a></p>`:""}</div>`;
  if (!bu) return;
  const sc = document.createElement("script");
  sc.async = true; sc.src = "https://telegram.org/js/telegram-widget.js?22";
  sc.setAttribute("data-telegram-login", bu); sc.setAttribute("data-size", "large"); sc.setAttribute("data-radius", "12");
  sc.setAttribute("data-onauth", "onTgAuth(user)"); sc.setAttribute("data-request-access", "write");
  document.getElementById("tgw").appendChild(sc);
}
window.onTgAuth = async function(user){
  try {
    const r = await fetch("/api/weblogin", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(user)});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json(); store.set("web_token", d.token); store.set("web_name", d.name); store.set("web_photo", d.photo||"");
    location.reload();
  } catch(e){ toast(e.message || "Kirib bo'lmadi"); }
};

(async function init(){
  if (!tg && !store.get("web_token")) return renderLogin();
  render();
  try { await Promise.all([loadMe(), api("/api/catalog").then(c=>S.catalog=c), api("/api/bank").then(b=>{S.bank=b.fanlar; S.soon=b.tez_orada||[];})]); }
  catch(e){ if (!tg && !store.get("web_token")) return; $app.innerHTML = `<div class="loader"><b>Ulanib bo'lmadi</b><p>${esc(e.message)}</p></div>`; return; }
  render();
})();
</script>
